[package]
name = "termx-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Term-IX GUI (egui/eframe): menu, strom serveru, taby (Home/Nastaveni/Spojeni)"

[dependencies]
termx-core = { workspace = true }
termx-vault = { workspace = true }
# Kontrola dostupnosti nove verze (bez stahovani) pro zobrazeni v Home
# tabu - viz `termx_update::check_latest_version` volane na
# samostatnem vlakne z `app.rs`.
termx-update = { workspace = true }
# Skutecne SSH spojeni (`termx_ssh::spawn_ssh_session`) pro Connection
# tab - viz `terminal.rs`.
termx-ssh = { workspace = true }
# Skutecne seriove/COM spojeni (`termx_serial::spawn_serial_session`) pro
# Connection tab - stejny ucel jako `termx-ssh` vyse, jen pro
# `Protocol::Serial`. Viz `terminal.rs`.
termx-serial = { workspace = true }
# Skutecne FTP/FTPS spojeni (`termx_ftp::spawn_ftp_session`) pro Ftp tab -
# stejny ucel jako `termx-ssh` vyse pro SFTP, jen samostatny protokol misto
# SSH subsystemu. Viz `ftp_browser.rs`.
# Skutecne RDP spojeni (`termx_rdp::spawn_rdp_session`) pro Rdp tab -
# stejny ucel jako `termx-ftp` vyse, jen pro `Protocol::Rdp`. Na rozdil od
# ostatnich protokolu se plocha vykresluje v SAMOSTATNEM OS okne
# (deferred viewport), ne primo v tabu - viz `rdp_viewer.rs`.
termx-ftp = { workspace = true }
termx-rdp = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# (De)serializace `AppSettings` (viz `app.rs`) do beznho eframe
# perzistentniho ulozneho prostoru (cargo feature "persistence" u
# `eframe` nize, uz drive vyuzivana pro `persist_window`).
serde = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
# Jen kvuli zapnuti cargo features "wayland"/"x11" u `egui-winit`
# (unifikace features - primo ho v kodu nepouzivame). `eframe` mame s
# `default-features = false` (viz korenovy Cargo.toml), cimz se vypnuly i
# jeho vychozi features "wayland"/"x11" - `winit` sam Wayland umi (zapina
# ho jina zavislost), ale `egui-winit` bez feature "wayland" vubec
# nepredava `ViewportBuilder::with_app_id` do winitu (viz
# `create_winit_window_attributes` v egui-winit: `#[cfg(feature =
# "wayland")] ... with_name(app_id, "")`). Okno pak na Waylandu nemelo
# zadne app_id a KDE Plasma/GNOME k nemu nenasly `term-ix.desktop` ->
# genericka ikona "W" misto ikony Term-IX (zjisteno na openSUSE
# Slowroll + Plasma 6/Wayland). "x11" ze stejneho duvodu pro WM_CLASS na X11.
# (Zapnuti pres features `eframe` - "wayland"/"x11" - by slo taky, ale
# ty navic odkazuji na volitelne `egui-wgpu`, ktere v projektu nemame.)
egui-winit = { version = "0.29", default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Nativni "Ulozit jako.../Otevrit soubor..." dialog pro export/import
# trezoru (tlacitko "Prochazet..." v prislusnych dialozich v app.rs).
rfd = { workspace = true }
# Jen kvuli typu `tokio::sync::mpsc::UnboundedSender` pouzivanemu pro
# odesilani klavesoveho vstupu do bezici SSH relace (viz `terminal.rs`
# a `termx_ssh::SshHandle`) - zadny tokio runtime si `termx-gui` sam
# nezaklada, `UnboundedSender::send` je bezna (ne-asynchronni) metoda.
tokio = { workspace = true }
# Vestaveny terminalovy emulator (VT100/ANSI parser + mrizka znaku) -
# viz `terminal.rs`.
alacritty_terminal = { workspace = true }
