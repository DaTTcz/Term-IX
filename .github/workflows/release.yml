name: Release

# Spousti se pri vytvoreni tagu ve tvaru "vX.Y.Z" (napr. v0.8.7), nebo
# rucne (workflow_dispatch - plny build + testy, ale BEZ vydani releasu,
# na vyzkouseni zmen v buildu).
#
# Struktura prevzata z eR Commanderu (`.github/workflows/build.yml`), kde
# uz funguje: version -> build-windows + build-linux -> test-linux ->
# release. Release vznikne jen z tagu a jen kdyz vsechny testy projdou.
#
# VERZE SE BERE Z TAGU: tag v0.8.7 -> build si sam prepise verzi
# v Cargo.toml i Cargo.lock na 0.8.7 (jen v CI, do repozitare se nic
# necommituje). Tag musi mit tvar vX.Y.Z, jinak build skonci chybou.
#
# Soubory v releasu:
#   term-ix-x86_64-pc-windows-msvc.zip       Windows (+ samo-aktualizace)
#   term-ix-x86_64-unknown-linux-gnu.tar.gz  Linux prenosna binarka (+ samo-aktualizace)
#   term-ix-x86_64.AppImage                  Linux univerzalni (+ samo-aktualizace)
#   term-ix_<verze>_amd64.deb                Debian / Ubuntu / Mint
#   term-ix-<verze>.x86_64.rpm               openSUSE / Fedora
#
# POZOR: nazvy zip/tar.gz MUSI obsahovat cely target triple - podle nej
# hleda asset samo-aktualizace (crates/termx-update). AppImage, .deb a
# .rpm ho naopak mit NESMI, aby se s tar.gz nepletly. Jak se ktera
# varianta aktualizuje, viz `termx_update::InstallMode`.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BIN_NAME: term-ix
  CARGO_TERM_COLOR: always

jobs:
  # ── Verze: z tagu (vX.Y.Z), pri rucnim spusteni z Cargo.toml ──────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Verze z tagu ${GITHUB_REF_NAME}: $VERSION"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag ${GITHUB_REF_NAME} nema tvar vX.Y.Z (napr. v0.8.7)"
              exit 1
            fi
          else
            VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
            echo "Verze v Cargo.toml (rucni spusteni): $VERSION"
            if [ -z "$VERSION" ]; then echo "::error::V Cargo.toml nebyla nalezena verze"; exit 1; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Klic cache se pocita z puvodniho Cargo.toml/Cargo.lock - proto
      # AZ PRED zmenou verze nize, jinak by kazdy release mel jinou cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      # Prepise `[workspace.package] version` (jedina radka `version = ...`
      # na zacatku radku - vsechny crates maji `version.workspace = true`)
      # a `cargo update --workspace` srovna Cargo.lock (meni JEN nase
      # crates, ne zavislosti), aby `--locked` build prosel.
      - name: Verze do Cargo.toml / Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          cargo update --workspace
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin term-ix
      - name: Zabalit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/${BIN_NAME}.exe" dist/
          cd dist
          7z a "${BIN_NAME}-x86_64-pc-windows-msvc.zip" "${BIN_NAME}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  # ── Linux: build ve starem Ubuntu kvuli glibc ───────────────────────────
  # Binarka postavena na novem Ubuntu se na starsich distribucich nespusti
  # ("GLIBC_2.xx not found"). Build uvnitr ubuntu:22.04 (glibc 2.35) pobezi
  # na vsem novejsim (Mint 21+, Debian 12+, Fedora, openSUSE...) - stejne
  # jako eR Commander.
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu:22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # GUI -dev knihovny (stejna sada jako v `ci.yml`) + `libudev-dev`
      # kvuli `termx-serial` (crate `serialport` hleda `libudev.pc`).
      - name: Systemove balicky
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates curl wget git file build-essential pkg-config \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - name: Verze do Cargo.toml / Cargo.lock
        run: |
          set -eu
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          cargo update --workspace
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin term-ix
      - name: Kontrola binarky
        run: |
          set -eu
          B="target/x86_64-unknown-linux-gnu/release/${BIN_NAME}"
          file "$B"
          ldd "$B" || true
          OUT=$("$B" --version)
          echo "$OUT"
          [ "$OUT" = "term-ix ${VERSION}" ] || { echo "::error::Binarka hlasi '$OUT', cekam verzi ${VERSION}"; exit 1; }
          mkdir -p dist
          cp "$B" dist/
          chmod +x "dist/${BIN_NAME}"

      - name: tar.gz (prenosna binarka)
        run: tar -czf "${BIN_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C dist "${BIN_NAME}"

      # AppImage: `APPIMAGE` (cestu k .AppImage souboru) nastavuje runtime
      # - podle ni appka pozna, ze ma aktualizovat cely .AppImage a kam
      # ma ukazovat zastupce v menu (viz `termx_update::InstallMode`).
      - name: AppImage
        run: |
          set -e
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp "dist/${BIN_NAME}" AppDir/usr/bin/
          cp packaging/linux/term-ix.desktop AppDir/usr/share/applications/
          cp packaging/linux/term-ix.desktop AppDir/
          for sz in 16 32 48 64 128 256 512; do
            mkdir -p "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps"
            cp "assets/icons/hicolor/${sz}x${sz}/apps/term-ix.png" "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps/"
          done
          cp assets/icons/hicolor/256x256/apps/term-ix.png AppDir/term-ix.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/term-ix" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract > /dev/null
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "${BIN_NAME}-x86_64.AppImage"
          chmod +x "${BIN_NAME}-x86_64.AppImage"

      - name: .deb a .rpm (nfpm)
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' > /etc/apt/sources.list.d/goreleaser.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y nfpm
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t "term-ix_${VERSION}_amd64.deb"
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t "term-ix-${VERSION}.x86_64.rpm"
          ls -la *.tar.gz *.AppImage *.deb *.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: linux-tar
          path: ${{ env.BIN_NAME }}-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: ${{ env.BIN_NAME }}-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: term-ix_*_amd64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: term-ix-*.x86_64.rpm
          if-no-files-found: error

  # ── Test na distribucich ────────────────────────────────────────────────
  # GUI se v CI spustit neda, ale `--version` overi to podstatne: ze se
  # binarka na dane distribuci vubec nacte (glibc, libudev) a ze balicek
  # jde nainstalovat a da program do PATH.
  test-linux:
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 (.deb + AppImage)
            image: ubuntu:22.04
            package: deb
          - name: Ubuntu 24.04 (.deb + AppImage)
            image: ubuntu:24.04
            package: deb
          - name: Debian 13 (.deb + AppImage)
            image: debian:trixie
            package: deb
          - name: Fedora (.rpm + AppImage)
            image: fedora:latest
            package: rpm
          - name: openSUSE Tumbleweed (.rpm + AppImage)
            image: opensuse/tumbleweed
            package: rpm
          - name: Arch Linux (tar.gz + AppImage)
            image: archlinux:latest
            package: none
    name: Test ${{ matrix.name }}
    container:
      image: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: pkg
          merge-multiple: true
      - name: Instalace balicku
        shell: bash
        run: |
          set -e
          ls -la pkg
          case "${{ matrix.package }}" in
            deb)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ./pkg/*.deb ;;
            rpm)
              if command -v zypper >/dev/null; then
                zypper --non-interactive install --allow-unsigned-rpm --no-recommends ./pkg/*.rpm
              else
                dnf install -y --setopt=install_weak_deps=False ./pkg/*.rpm
              fi ;;
            none)
              # tar.gz/AppImage nic neinstaluji - libudev musi byt v systemu
              # (na beznem desktopu vzdy je; v archlinux kontejneru je
              # soucasti zakladu). Doinstaluje se jen kdyby chybela - a pak
              # s plnym `-Syu`, protoze samotne `-Sy <balik>` (castecny
              # upgrade) na Archu selhava na zavislostech (v0.9.1).
              if ldconfig -p | grep -q 'libudev\.so\.1'; then
                echo "libudev.so.1 je v systemu"
              else
                pacman -Syu --noconfirm --needed systemd-libs
              fi ;;
          esac
      - name: Spusteni (--version)
        shell: bash
        run: |
          set -u
          failed=0
          check() {
            local label="$1"; shift
            local out
            out=$("$@" 2>&1); local rc=$?
            echo "$label: $out"
            if [ $rc -ne 0 ] || [ "$out" != "term-ix ${VERSION}" ]; then
              echo "::error::$label: spusteni selhalo (kod $rc): $out"
              failed=1
            fi
          }
          if [ "${{ matrix.package }}" != "none" ]; then
            check "Nainstalovany .${{ matrix.package }}" term-ix --version
            test -f /usr/share/applications/term-ix.desktop || { echo "::error::Chybi .desktop soubor"; failed=1; }
          else
            mkdir -p tarbin && tar -xzf pkg/term-ix-x86_64-unknown-linux-gnu.tar.gz -C tarbin
            check "tar.gz binarka" ./tarbin/term-ix --version
          fi
          chmod +x pkg/term-ix-x86_64.AppImage
          check "AppImage" ./pkg/term-ix-x86_64.AppImage --appimage-extract-and-run --version
          exit $failed

  # ── Release (jen z tagu, jen kdyz vsechno proslo) ────────────────────────
  release:
    needs: [build-windows, build-linux, test-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
          generate_release_notes: true
