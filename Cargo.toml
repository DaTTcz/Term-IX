[workspace]
resolver = "2"
members = [
    "crates/termx-core",
    "crates/termx-vault",
    "crates/termx-update",
    "crates/termx-ssh",
    "crates/termx-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DaTTcz"]
repository = "https://github.com/DaTTcz/Term-IX"
license = "MIT"

[workspace.dependencies]
termx-core = { path = "crates/termx-core" }
termx-vault = { path = "crates/termx-vault" }
termx-update = { path = "crates/termx-update" }
termx-ssh = { path = "crates/termx-ssh" }
termx-tui = { path = "crates/termx-tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
directories = "5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "term-ix"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Term-IX - modularni terminalovy klient (SSH/Serial/FTP...) inspirovany MobaXtermem"

[[bin]]
name = "term-ix"
path = "src/main.rs"

[dependencies]
termx-core = { workspace = true }
termx-vault = { workspace = true }
termx-update = { workspace = true }
termx-ssh = { workspace = true }
termx-tui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rpassword = "7"
