[workspace]
resolver = "2"
members = [
    "crates/termx-core",
    "crates/termx-vault",
    "crates/termx-update",
    "crates/termx-ssh",
    "crates/termx-splash",
    "crates/termx-gui",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["DaTTcz"]
repository = "https://github.com/DaTTcz/Term-IX"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
termx-core = { path = "crates/termx-core" }
termx-vault = { path = "crates/termx-vault" }
termx-update = { path = "crates/termx-update" }
termx-ssh = { path = "crates/termx-ssh" }
termx-splash = { path = "crates/termx-splash" }
termx-gui = { path = "crates/termx-gui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
directories = "5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
# Vestaveny terminalovy emulator (VT100/ANSI) pro Connection tab v
# termx-gui - parsuje bajty prichozi ze SSH kanalu (termx-ssh) a drzi
# stav obrazovky (mrizka znaku, barvy, kurzor), ktery termx-gui
# vykresluje primo v tabu misto puvodni nahradni obrazovky.
alacritty_terminal = "0.24"

[package]
name = "term-ix"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Term-IX - modularni terminalovy klient (SSH/Serial/FTP...) inspirovany MobaXtermem"

[[bin]]
name = "term-ix"
path = "src/main.rs"

[dependencies]
termx-core = { workspace = true }
termx-ssh = { workspace = true }
termx-splash = { workspace = true }
termx-gui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Vklada ikonu (assets/icons/term-ix.ico) do vysledneho .exe - resi se jen
# pri buildu na/pro Windows, viz build.rs.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
