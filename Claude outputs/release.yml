name: Release

# Spousti se pri vytvoreni tagu ve tvaru "vX.Y.Z" (napr. v0.4.0), nebo
# rucne (workflow_dispatch). Zabuildi term-ix pro Windows i Linux a
# nahraje binarky do GitHub Release pod nazvy obsahujicimi cely target
# triple - presne to, co pri startu hleda self-update modul
# (crates/termx-update) pres crate `self_update`.
#
# Sjednoceno s obdobnym workflow v eR-Commanderu
# (https://github.com/DaTTcz/eR-Commander, `.github/workflows/release.yml`) -
# stejna struktura (samostatny "build" job pro kazdou platformu +
# navazujici "release" job, ktery vsechny artefakty stahne a az pak
# vytvori jedno GitHub Release), stejna sada systemovych -dev knihoven
# jako v `ci.yml` tady. Nazvy vyslednych souboru zustavaji beze zmeny
# oproti puvodni verzi tohoto souboru (`term-ix-<target>.zip`/`.tar.gz`),
# takze self-update zustava kompatibilni.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BIN_NAME: term-ix

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          # Zamerne ubuntu-24.04, NE ubuntu-latest: od listopadu 2026 ukazuje
          # ubuntu-latest na 26.04 ("resolute") s novejsi glibc - binarka
          # postavena tam by se na starsich distribucich (napr. Linux Mint
          # 22 na zakladu 24.04) nespustila. Binarka z 24.04 bezi i na
          # novejsich (Kubuntu 26.04).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64

    runs-on: ${{ matrix.os }}
    # Zaseknuty runner (napr. 11/2026 vypadek DNS pri apt-get - visel pres
    # pul hodiny) nema viset hodiny. Plny release build trva ~15 min.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Verze appky se bere z TAGU (v0.8.2 -> 0.8.2), neni potreba ji pred
      # vydanim rucne menit v Cargo.toml. Prepise se `[workspace.package]
      # version` (jedina radka `version = "..."` na zacatku radku v
      # Cargo.toml - vsechny crates maji `version.workspace = true`) a
      # `cargo update --workspace` srovna Cargo.lock (meni JEN nase crates,
      # ne zavislosti), aby nasledny `--locked` build prosel.
      # `env!("CARGO_PKG_VERSION")` (titulek okna, About, self-update) tak
      # vzdy odpovida tagu. Zamerne AZ PO "Cache cargo" - rust-cache si
      # klic spocita z puvodniho Cargo.toml/Cargo.lock, takze zmena verze
      # cache nerozbije. Pri rucnim spusteni (workflow_dispatch, bez tagu)
      # se krok preskoci a pouzije se verze z Cargo.toml.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' neni ve tvaru vX.Y.Z"
            exit 1
          fi
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          grep -n '^version = ' Cargo.toml
          cargo update --workspace
          echo "Verze nastavena na ${VERSION}"

      # Stejna sada jako v `ci.yml` (a v eR-Commanderu) - viz komentar
      # tam. `libudev-dev` navic pridano kvuli `termx-serial`
      # (crate `serialport` na Linuxu pro vypis dostupnych
      # /dev/ttyUSB*/... portu pouziva `libudev-sys`, ktery pres
      # pkg-config hleda `libudev.pc` - bez teto -dev knihovny selhava
      # uz samotny build s "Package libudev was not found").
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libasound2-dev \
            libudev-dev

      # --locked: builduj presne podle commitnuteho Cargo.lock - zadne
      # "tise jina verze zavislosti".
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin term-ix

      # Nazev souboru MUSI obsahovat cely target triple - podle nej hleda
      # spravny asset self-update kod (crates/termx-update).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "dist/"
          cd dist
          7z a "${BIN_NAME}-${{ matrix.target }}.zip" "${BIN_NAME}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/"
          chmod +x "dist/${BIN_NAME}"
          cd dist
          tar -czf "${BIN_NAME}-${{ matrix.target }}.tar.gz" "${BIN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true